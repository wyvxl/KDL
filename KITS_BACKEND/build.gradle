plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.kits'
version = '0.0.1-SNAPSHOT'
description = 'KITS'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // HikariCP ya viene con spring-boot-starter-jdbc; no hace falta declararlo.
    // ojdbc17 es el artefacto que Oracle publica para JDK 17+ (mismo driver que ojdbc11).
    implementation 'com.oracle.database.jdbc:ojdbc17'
    // Lee el wallet (cwallet.sso) de Oracle Autonomous Database cuando la conexión es
    // con mTLS. Con TLS simple (sin wallet) no se usa, pero no estorba.
    implementation 'com.oracle.database.security:oraclepki'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // JWT (jjwt) con serializador Gson para no acoplarnos a la version de Jackson de Spring Boot 4
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Un solo JAR ejecutable con nombre fijo, para que el Dockerfile lo copie sin comodines
// (el JAR "plain" sin dependencias no se usa para nada).
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
tasks.named('jar') {
    enabled = false
}
