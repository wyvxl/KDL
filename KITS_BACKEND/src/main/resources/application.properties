spring.application.name=kits-backend
# Render asigna el puerto en PORT; en local se usa 8080.
server.port=${PORT:8080}

# ===================================================================
# SPRING BOOT DATASOURCE CONFIGURATION (HikariCP)
# Centraliza toda la configuraci�n aqu�. Spring Boot autoconfigura
# el DataSource y el pool de conexiones Hikari con estas propiedades.
# ===================================================================

# --- Datos de Conexi�n a Oracle ---
# En la nube se sobrescriben con variables de entorno (ver DESPLIEGUE.md).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREE}
spring.datasource.username=${DB_USERNAME:KITS}
spring.datasource.password=${DB_PASSWORD:Kits2025}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- Propiedades del Pool de Conexiones Hikari ---
# Autonomous Database Always Free limita las sesiones: en la nube conviene 5.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=KitsBackendHikariPool

# ===================================================================
# JWT (autenticacion stateless)
# El secreto se puede sobreescribir con la variable de entorno JWT_SECRET.
# Debe tener al menos 32 caracteres (256 bits) para HS256.
# ===================================================================
jwt.secret=${JWT_SECRET:KitsUniversityProjectSecretKey_ChangeMe_0123456789abcdef}
jwt.expiration-ms=86400000

# CORS: origen permitido del frontend (sobreescribible con CORS_ALLOWED_ORIGIN)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
