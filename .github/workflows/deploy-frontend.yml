# Publica el frontend en GitHub Pages en cada push a master que toque KITS_FRONTEND.
#
# Requisitos (una sola vez, ver DESPLIEGUE.md):
#   - Settings > Pages > Source: "GitHub Actions".
#   - Settings > Secrets and variables > Actions > Variables: VITE_API_URL con la URL
#     del backend en Render (p. ej. https://kits-backend.onrender.com).
name: Desplegar frontend

on:
  push:
    branches: [master]
    paths:
      - 'KITS_FRONTEND/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, el que estaba en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KITS_FRONTEND
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KITS_FRONTEND/package-lock.json

      - name: Verificar que VITE_API_URL está configurada
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Falta la variable VITE_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint

      - name: Compilar
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # El sitio queda en https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages no sabe de rutas como /KDL/pedidos: al recargar devolvería 404.
      # Con una copia de index.html como 404.html, la app carga y el router resuelve la ruta.
      - name: Soporte para recargar en cualquier ruta
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: KITS_FRONTEND/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
